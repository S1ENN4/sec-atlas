name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: validate, build, budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned to full commit SHAs (a tag can be re-pointed).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The translation drift guarantees are part of the public promise too.
      - run: npm run test:i18n

      # The MCP server is part of the public promise: keep it working.
      - run: npm run test:mcp

      # Learning engine: ready / locked / next rules shared by the maps.
      - run: npm run test:learning

      # prebuild runs the content validator (R1-R8); build ends with the
      # bundle-size budget. Any failure fails the job.
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://example.com

      # Every internal link and anchor in the exported site must resolve.
      - run: npm run check:links

      # End to end: the maps, the lab and accessibility (WCAG A/AA, both themes),
      # against the exported site served the way production serves it.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
