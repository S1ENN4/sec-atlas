# Server config for the static export. It reproduces what public/_headers and
# public/_redirects do on Netlify-style hosts:
#   - security headers (the CSP omits `upgrade-insecure-requests` on purpose: the
#     site is plain relative URLs, and that directive breaks plain-HTTP hosts such
#     as a private tailnet; add it back if you only ever serve over HTTPS)
#   - "/" picks a language from Accept-Language (pt, es, otherwise en)
#   - legacy Portuguese-only URLs redirect to /pt/...
#   - clean URLs: /en/owasp -> en/owasp.html

map $http_accept_language $home_lang {
    default /en;
    ~*^pt   /pt;
    ~*^es   /es;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    port_in_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Language at the root.
    location = / {
        add_header Vary "Accept-Language" always;
        add_header Cache-Control "no-store" always;
        return 302 $home_lang;
    }

    # Legacy URLs (Portuguese only, before multi-language routing).
    rewrite ^/appsec/?$                 /pt/appsec permanent;
    rewrite ^/cloudsec/?$               /pt/cloudsec permanent;
    rewrite ^/agentes/?$                /pt/agents permanent;
    rewrite ^/secops/?$                 /pt/secops permanent;
    rewrite ^/engenharia/?$             /pt/engineering permanent;
    rewrite ^/appsec/topico/(.+)$       /pt/appsec/topic/$1 permanent;
    rewrite ^/cloudsec/topico/(.+)$     /pt/cloudsec/topic/$1 permanent;
    rewrite ^/agentes/topico/(.+)$      /pt/agents/topic/$1 permanent;
    rewrite ^/secops/topico/(.+)$       /pt/secops/topic/$1 permanent;
    rewrite ^/engenharia/topico/(.+)$   /pt/engineering/topic/$1 permanent;
    rewrite ^/topico/(.+)$              /pt/appsec/topic/$1 permanent;
    rewrite ^/trilhas/?$                /pt/paths permanent;
    rewrite ^/cenarios/?$               /pt/scenarios permanent;
    rewrite ^/glossario/?$              /pt/glossary permanent;
    rewrite ^/seguranca/?$              /pt/security permanent;
    rewrite ^/sobre/?$                  /pt/about permanent;
    rewrite ^/novidades/?$              /pt/changelog permanent;
    rewrite ^/fontes/?$                 /pt/sources permanent;
    rewrite ^/manifesto/?$              /pt/manifesto permanent;

    # Hashed build assets never change.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        try_files $uri =404;
    }

    # Drop a trailing slash: /en/owasp/ -> /en/owasp
    location ~ ^/(.+)/$ {
        return 301 /$1;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
